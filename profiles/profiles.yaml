version: 1

profiles:
  official-admin:
    description: "Письма, записки, справки, акты, протоколы, приказы и другая административно-канцелярская документация."
    enable:
      - DOC-M01
      - DOC-M02
      - DOC-M05
      - DOC-P01
      - LDB-001
      - LDB-002
      - LDB-003
      - LDB-004
      - LDB-005
      - LDB-006
      - LDB-008
      - LDB-009
      - LDB-010
      - LDB-012
      - LDB-013
      - LDB-016
    protect:
      - defined_terms
      - legal_modality
      - relative_deadline
      - deadline_anchor
      - conventional_document_cliches
    downgrade:
      generic_passive_voice: INFO
      generic_nominalization: INFO
      generic_sentence_length: INFO
    disable_for_protected_spans:
      - generic_synonymize_repetition
      - generic_modality_simplification
      - generic_time_simplification
      - generic_cliche_rewrite

  official-admin/letter:
    extends: official-admin
    description: "Служебные и деловые письма."
    enable:
      - ADM-LETTER-001
    notes:
      - "Не навязывать трёхчастную композицию короткому письму: основание и аналитическая часть нужны только по функции."
      - "Для отказа основания и логическая связь с выводом важнее ритуальной канцелярской длины."

  official-admin/order:
    extends: official-admin
    description: "Приказы и близкие распорядительные документы с явной распорядительной частью."
    enable:
      - LDB-014
      - ADM-ORDER-001
    protect:
      - directive_infinitive
    disable_for_protected_spans:
      - generic_imperative_rewrite
    notes:
      - "Инфинитивное побуждение является функциональным именно в распорядительной части и не переносится на все official-admin документы."

  official-admin/act:
    extends: official-admin
    description: "Акты, фиксирующие установленные факты или события и выводы комиссии/составителей."
    enable:
      - ADM-ACT-001
    notes:
      - "Проверять функциональное разделение основания/события, установленных фактов и выводов; не выдумывать отсутствующие факты."

  normative:
    description: "Положения, правила, инструкции, регламенты, локальные нормативные акты."
    enable:
      - DOC-M03
      - DOC-M04
      - DOC-M05
      - DOC-N04
      - DOC-P01
      - LDB-001
      - LDB-002
      - LDB-003
      - LDB-004
      - LDB-005
      - LDB-006
      - LDB-007
      - LDB-008
      - LDB-009
      - LDB-010
      - LDB-011
      - LDB-012
      - LDB-013
      - LDB-015
      - LDB-016
    protect:
      - defined_terms
      - legal_modality
      - condition_scope_marker
      - exception_scope_marker
      - relative_deadline
      - deadline_anchor
      - conventional_document_cliches
      - functional_long_syntax
    downgrade:
      generic_sentence_length: INFO
    disable_for_protected_spans:
      - generic_synonymize_repetition
      - generic_modality_simplification
      - generic_time_simplification
      - generic_cliche_rewrite
      - generic_sentence_split

  normative/legislation:
    extends: normative
    description: "Законопроектная юридическая техника."
    enable:
      - DOC-N01
      - DOC-N02
      - DOC-N03
    protect:
      - conditional_norm_structure
    override:
      DOC-N01:
        severity: REVIEW
      DOC-N02:
        severity: REVIEW
    notes:
      - "Правила преамбулы и законодательной иерархии не применяются к договорам и корпоративным политикам."
      - "Сложное или условное предложение не дробить только по длине, если связи гипотезы, предписания и исключений остаются однозначными."

  contractual:
    description: "Договоры, соглашения, приложения, оферты и другие договорные документы."
    enable:
      - DOC-M05
      - DOC-N04
      - DOC-P01
      - DOC-P02
      - LDB-001
      - LDB-002
      - LDB-003
      - LDB-005
      - LDB-006
      - LDB-007
      - LDB-008
      - LDB-009
      - LDB-010
      - LDB-011
      - LDB-012
      - LDB-013
      - LDB-015
      - LDB-016
      - CTR-001
      - CTR-002
      - CTR-003
      - CTR-004
    protect:
      - defined_terms
      - party_names
      - obligation_modality
      - obligation_action
      - condition_scope_marker
      - exception_scope_marker
      - relative_deadline
      - deadline_anchor
      - breach_trigger
      - legal_consequence
      - cross_references
      - functional_long_syntax
    disable_for_protected_spans:
      - generic_synonymize_repetition
      - generic_pronoun_substitution
      - generic_modality_simplification
      - generic_action_generalization
      - generic_time_simplification
      - generic_consequence_softening
      - generic_sentence_split
    downgrade:
      generic_passive_voice: INFO
      generic_nominalization: INFO
      generic_sentence_length: INFO
    notes:
      - "Сильные формулы обязанности/права/запрета защищаются от упрощения, но токен «может» сам по себе не классифицируется как право."
      - "Условия и исключения не переставлять между предписаниями без проверки их области действия."
      - "Если обязанная сторона выражена только контекстом, не подставлять её автоматически: сначала проверить структуру договора."
      - "После сильной личной формулы обязанности сохранять конкретное действие; объект, объём, качество и иные параметры проверять семантически, а не додумывать."
      - "Относительный срок не переписывать без сохранения события, от которого он исчисляется."
      - "В разделе ответственности не разрывать связь между нарушением и последствием; отсутствие локального последствия означает REVIEW, а не автоматическую вставку санкции."

  legal-procedural:
    description: "Претензии, иски, отзывы, ходатайства и другая процессуальная документация."
    enable:
      - DOC-N04
      - DOC-P01
      - LDB-001
      - LDB-002
      - LDB-003
      - LDB-005
      - LDB-006
      - LDB-007
      - LDB-009
      - LDB-010
      - LDB-011
      - LDB-012
      - LDB-013
      - LDB-016
    protect:
      - participant_names
      - legal_qualification_terms
      - requested_relief
      - cross_references
      - relative_deadline
      - deadline_anchor
      - functional_long_syntax
    downgrade:
      generic_sentence_length: INFO
    disable_for_protected_spans:
      - generic_time_simplification
      - generic_sentence_split
    notes:
      - "Не навязывать универсальную структуру процессуального документа без источника для конкретного вида документа и применимого процесса."
      - "Контролируемая оценочность/эмоциональность допустима в отдельных жанрах и не блокируется общим правилом нейтральности."
