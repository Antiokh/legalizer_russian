name: runtime

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install '.[dev]'
      - run: pytest
      - run: cd /tmp && legalizer doctor --json > /tmp/doctor.json
      - run: cd /tmp && legalizer resolve --profile contractual --json > /tmp/resolved.json
      - run: cd /tmp && legalizer resolve --profile official-admin/order --json > /tmp/order-profile.json
      - run: cd /tmp && legalizer sources --date 2026-08-29 --json > /tmp/sources.json
      - run: |
          cat > /tmp/contract.md <<'EOF'
          ООО «Альфа», именуемое в дальнейшем «Заказчик», и ООО «Бета», именуемое в дальнейшем «Исполнитель», заключили договор.
          Заказчик обязан оплатить услуги в течение 5 рабочих дней с даты получения счёта и вправе запросить отчёт.

          5. Ответственность сторон
          5.1. В случае просрочки Заказчик уплачивает неустойку 0,1 процента.
          EOF
      - run: cd /tmp && legalizer check /tmp/contract.md --profile contractual --json > /tmp/contract-check.json
      - run: cd /tmp && legalizer protect /tmp/contract.md --profile contractual --json > /tmp/contract-protection.json
      - run: |
          cat > /tmp/bad-contract.md <<'EOF'
          ООО «Альфа», именуемое в дальнейшем «Заказчик», и ООО «Бета», именуемое в дальнейшем «Исполнитель», заключили договор.
          Обязан оплатить услуги в течение 5 рабочих дней.
          Заказчик обязан.

          5. Ответственность сторон
          5.1. За нарушение срока передачи результата работ.
          EOF
      - name: Expect contract precision review findings
        run: |
          cd /tmp
          set +e
          legalizer check /tmp/bad-contract.md --profile contractual --json > /tmp/bad-contract-check.json
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'CTR-002' /tmp/bad-contract-check.json
          grep -q 'CTR-003' /tmp/bad-contract-check.json
          grep -q 'CTR-004' /tmp/bad-contract-check.json
          grep -q 'LDB-016' /tmp/bad-contract-check.json
      - run: printf 'ПРИКАЗЫВАЮ:\n1. Директору подготовить предложения.\n2. Бухгалтерии открыть счёт.\n' > /tmp/order.md
      - run: cd /tmp && legalizer check /tmp/order.md --profile official-admin/order --json > /tmp/order-check.json
      - run: cd /tmp && legalizer protect /tmp/order.md --profile official-admin/order --json > /tmp/order-protection.json
